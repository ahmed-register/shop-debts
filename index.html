<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر الديون</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f6f4;--card:#fff;--text:#14201b;--muted:#5d6d66;--line:#d9e2dd;--brand:#0f766e;--brand2:#14b8a6;--bt:#fff;--danger:#c0392b;--ok:#15803d;--glow:rgba(20,184,166,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0c1512;--card:#14201c;--text:#e8f1ed;--muted:#93a69d;--line:#26362f;--brand:#14b8a6;--brand2:#2dd4bf;--bt:#06201c;--danger:#ff7b6b;--ok:#4ade80;--glow:rgba(45,212,191,.2)}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:20px 14px}
.wrap{max-width:440px;margin:0 auto}
h1{text-align:center;margin:8px 0 4px;font-size:26px}.sub{text-align:center;color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
label{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
.in{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:16px;padding:0 12px;margin-bottom:10px;outline:none}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--glow)}
.ltr{direction:ltr;text-align:left}
.btn{width:100%;height:48px;border-radius:12px;border:0;font:inherit;font-weight:800;font-size:16px;cursor:pointer;background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--bt)}
.btn.g{background:transparent;color:var(--text);border:1.5px solid var(--line);font-weight:700}
.btn.pay{background:var(--ok);color:#fff}.armed{background:var(--danger)!important;color:#fff!important}
.msg{min-height:18px;font-size:13px;color:var(--danger);margin:4px 0 8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:18px 10px;margin-bottom:12px;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font:inherit;cursor:pointer}
.tile b{font-size:19px}.tile small{color:var(--muted)}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.dh h2{margin:0;font-size:20px;flex:1}
.ib{height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--text);font:inherit;cursor:pointer}
.tot{border-radius:16px;padding:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--bt);margin-bottom:14px}
.tot b{display:block;font-size:28px;direction:ltr;text-align:right}
.box{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}.box h3{margin:0 0 10px;font-size:16px}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{background:var(--brand);color:var(--bt);padding:8px 5px;font-size:13px}
.tb td{padding:9px 5px;border-bottom:1px solid var(--line);vertical-align:top}
.trow{cursor:pointer}.c1{width:32px;text-align:center;color:var(--muted)}.c3{color:var(--muted);font-size:13px;line-height:1.6}
.c4{white-space:nowrap;text-align:left;font-weight:800;direction:ltr}.neg{color:var(--danger)}.z{color:var(--ok)}
.due{display:block;font-size:12px;color:var(--muted)}.due.late{color:var(--danger);font-weight:700}
.tx{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);padding:6px 0;border-bottom:1px dashed var(--line)}
.tx b{direction:ltr}.tx .p{color:var(--ok)}.tx .d{color:var(--danger)}
.acts{display:flex;gap:8px;margin-top:10px}.acts .in{margin:0;flex:1;min-width:0;direction:ltr;text-align:right}.acts .btn{width:auto;height:46px;padding:0 14px}
.full{margin-top:8px;height:42px}.empty{text-align:center;color:var(--muted);padding:16px}
input.in.rt{direction:rtl;text-align:right}
.acts .btn{flex:1}.ib.sm{height:30px;padding:0 10px;font-size:12px}
.txe{padding:6px 0;border-bottom:1px dashed var(--line)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-weight:700;color:var(--ok);display:none}

#vList[data-book=debts]{--brand:#c2410c;--brand2:#fb923c;--bt:#fff}
#vList[data-book=sports]{--brand:#1d4ed8;--brand2:#60a5fa;--bt:#fff}
#vTeam{--brand:#7e22ce;--brand2:#c084fc;--bt:#fff}
.tile .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center}
.tile .ic svg{width:30px;height:30px}
.tile[data-book=debts]{border-color:#fb923c;background:linear-gradient(135deg,rgba(234,88,12,.16),transparent)}
.tile[data-book=debts] .ic{background:linear-gradient(135deg,#c2410c,#fb923c)}
.tile[data-book=sports]{border-color:#60a5fa;background:linear-gradient(135deg,rgba(29,78,216,.18),transparent)}
.tile[data-book=sports] .ic{background:linear-gradient(135deg,#1d4ed8,#60a5fa)}
.tile[data-book=team]{border-color:#c084fc;background:linear-gradient(135deg,rgba(126,34,206,.18),transparent)}
.tile[data-book=team] .ic{background:linear-gradient(135deg,#7e22ce,#c084fc)}
.mini{border:1.5px solid var(--line);background:transparent;color:var(--text);border-radius:8px;width:30px;height:28px;cursor:pointer;flex:none}
.acts .btn{flex:1}
.btn.more{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.tx .t1{flex:1}
#vBoth{--brand:#be123c;--brand2:#fb7185;--bt:#fff}
.tile[data-book=both]{border-color:#fb7185;background:linear-gradient(135deg,rgba(190,18,60,.18),transparent)}
.tile[data-book=both] .ic{background:linear-gradient(135deg,#be123c,#fb7185)}
#vBackup{--brand:#15803d;--brand2:#4ade80;--bt:#fff}
.tile[data-book=backup]{border-color:#4ade80;background:linear-gradient(135deg,rgba(21,128,61,.2),transparent)}
.tile[data-book=backup] .ic{background:linear-gradient(135deg,#15803d,#4ade80)}
.bkb{width:100%;padding:12px;margin-bottom:12px;border-radius:14px;border:1.5px solid var(--danger);background:transparent;color:var(--danger);font:inherit;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<main class="wrap">

<section id="vLoad"><h1>دفتر الديون</h1><p class="sub">جارٍ التحميل...</p></section>

<section id="vLogin" hidden>
  <h1>دفتر الديون</h1><p class="sub">تسجيل الدخول</p>
  <div class="card">
    <label for="em">البريد الإلكتروني</label>
    <input class="in ltr" id="em" type="email" autocomplete="email" placeholder="name@gmail.com">
    <label for="pw">كلمة المرور</label>
    <input class="in ltr" id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="msg" id="lm"></div>
    <button class="btn" id="go" type="button">دخول</button>
    <button class="btn g full" id="forgot" type="button">نسيت كلمة المرور؟</button>
  </div>
</section>

<section id="vHome" hidden>
  <div class="dh"><h2>الرئيسية</h2><button class="ib" id="out" type="button">خروج</button></div>
  <p class="sub" id="who"></p>
  <button class="bkb" id="bkBanner" type="button" hidden>مرّ أكثر من 24 ساعة على آخر نسخة احتياطية. اضغط لإرسالها الآن إلى واتساب</button>
  <button class="tile" data-book="debts" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h12v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-3"/><path d="M21 9H5"/><path d="M21 9v6h-4a3 3 0 0 1 0-6z"/></svg></span><b>الديون</b><small>تسجيل ومتابعة ديون المحل</small></button>
  <button class="tile" data-book="sports" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span><b>ديون اشتراكات القنوات الرياضية</b><small>ديون مشتركي القنوات الرياضية</small></button>
  <button class="tile" data-book="team" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14h1a4 4 0 0 1 4 4v2"/></svg></span><b>فريق العمل</b><small>المالك والموظفون</small></button>
  <button class="tile" data-book="both" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg></span><b>زبائن في القسمين</b><small>مطلوبون في دين المحل والاشتراكات</small></button>
  <button class="tile" data-book="backup" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></span><b>النسخة الاحتياطية</b><small>حفظ البيانات وإرسالها إلى واتساب</small></button>
  <p class="sub" id="st"></p>
</section>

<section id="vList" hidden>
  <div class="dh"><button class="ib" id="back" type="button">رجوع</button><h2 id="title"></h2></div>
  <div class="tot"><small>إجمالي الديون</small><b id="tot">0</b><small id="late"></small></div>
  <div class="box">
    <h3>إضافة دين جديد</h3>
    <input class="in" id="n" list="names" placeholder="اسم الزبون" autocomplete="off">
    <input class="in" id="a" inputmode="decimal" placeholder="المبلغ" style="direction:ltr;text-align:right" autocomplete="off">
    <input class="in" id="it" placeholder="الحاجة المباعة (مثال: سكر)" autocomplete="off">
    <div id="dueW" hidden><label for="due">تاريخ استحقاق الاشتراك</label><input class="in ltr" id="due" type="date"></div>
    <div class="msg" id="hint" style="color:var(--brand);font-weight:700"></div>
    <button class="btn" id="add" type="button">إضافة الدين</button>
    <datalist id="names"></datalist>
  </div>
  <input class="in" id="q" placeholder="بحث عن زبون" autocomplete="off">
  <div id="list"></div>
</section>

<section id="vTeam" hidden>
  <div class="dh"><button class="ib" id="tBack" type="button">رجوع</button><h2>فريق العمل</h2></div>
  <div class="box"><h3>مالك المشروع</h3><input class="in" id="tOwner" placeholder="اسم المالك" autocomplete="off"></div>
  <div class="box"><h3>الموظفون</h3>
    <input class="in" id="tS0" placeholder="الموظف 1" autocomplete="off"><input class="in" id="tS1" placeholder="الموظف 2" autocomplete="off"><input class="in" id="tS2" placeholder="الموظف 3" autocomplete="off"><input class="in" id="tS3" placeholder="الموظف 4" autocomplete="off"><input class="in" id="tS4" placeholder="الموظف 5" autocomplete="off">
  </div>
  <button class="btn" id="tSave" type="button">حفظ الأسماء</button>
</section>

<section id="vBoth" hidden>
  <div class="dh"><button class="ib" id="bBack" type="button">رجوع</button><h2>زبائن في القسمين</h2></div>
  <div class="tot"><small>إجمالي ما عليهم في القسمين</small><b id="bTot">0</b><small id="bCnt"></small></div>
  <div id="bList"></div>
</section>

<section id="vBackup" hidden>
  <div class="dh"><button class="ib" id="bkBack" type="button">رجوع</button><h2>النسخة الاحتياطية</h2></div>
  <div class="box">
    <h3>حفظ نسخة كاملة</h3>
    <p class="sub" id="bkLast" style="text-align:right;margin:0 0 10px"></p>
    <button class="btn" id="bkWa" type="button">إرسال النسخة إلى واتساب</button>
    <button class="btn g full" id="bkSave" type="button">حفظ النسخة في الجوال</button>
    <button class="btn g full" id="bkCsv" type="button">تصدير جدول الزبائن (CSV)</button>
  </div>
  <div class="box" id="bkRestore" hidden>
    <h3>استعادة نسخة (للمالك فقط)</h3>
    <input class="in" id="rFile" type="file" accept=".json,.txt,application/json,text/plain" style="height:auto;padding:10px">
    <button class="btn g" id="bkRestoreBtn" type="button">استعادة النسخة</button>
  </div>
</section>

</main>
<div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,collection,onSnapshot,addDoc,updateDoc,deleteDoc,setDoc,doc,arrayUnion,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 1) الصق إعدادات مشروعك هنا (من Firebase Console > Project settings > Your apps) */
const firebaseConfig={apiKey:"AIzaSyBE0Y10IBFOks36JvCzsuPCXuBmMRjY-Wg",authDomain:"ahmed---shop.firebaseapp.com",projectId:"ahmed---shop",storageBucket:"ahmed---shop.firebasestorage.app",messagingSenderId:"256983045673",appId:"1:256983045673:web:2d057b51b2e6b5d62c6e38"};
/* 2) بريدك كمالك (يحذف الزبائن). يجب أن يطابق القائمة في firestore.rules */
const OWNERS=["watenahmedsubhe@gmail.com"];

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
const app=initializeApp(firebaseConfig),auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache()});
const col=collection(db,"shops","main","customers");
const TITLES={debts:"الديون",sports:"ديون اشتراكات القنوات الرياضية"};
let book="debts",data=[],openId=null,user=null,isOwner=false,unsub=null,ed=null,showAll=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=s=>{s=String(s).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/٫/g,".").replace(/[,٬\s]/g,"");const n=parseFloat(s);return isFinite(n)?n:NaN};
const fmt=n=>n.toLocaleString("en-US",{maximumFractionDigits:2});
const bal=c=>(c.tx||[]).reduce((a,t)=>a+(t.k==="d"?t.a:-t.a),0);
const nm=s=>String(s).replace(/\s+/g," ").trim().toLowerCase();
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const show=v=>["vLoad","vLogin","vHome","vList","vTeam","vBoth","vBackup"].forEach(x=>$(x).hidden=x!==v);
let tt;const toast=(m,bad)=>{const t=$("toast");t.textContent=m;t.style.color=bad?"var(--danger)":"var(--ok)";t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",3000)};
const w=p=>p.catch(e=>toast("تعذّر الحفظ: "+(e.code||""),1));
const disarm=(el,o)=>{delete el.dataset.armed;delete el.dataset.amt;el.textContent=o;el.classList.remove("armed")};
const arm=(el,t,o)=>{el.dataset.armed="1";el.textContent=t;el.classList.add("armed");setTimeout(()=>{if(el.isConnected&&el.dataset.armed)disarm(el,o)},6000)};

/* ---- الدخول ---- */
const errs={"auth/invalid-credential":"البريد أو كلمة المرور غير صحيحة","auth/invalid-email":"البريد غير صحيح","auth/too-many-requests":"محاولات كثيرة، حاول لاحقاً","auth/network-request-failed":"لا يوجد اتصال بالإنترنت"};
$("go").onclick=()=>{
  $("lm").style.color="";$("lm").textContent="";
  signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value).catch(e=>$("lm").textContent=errs[e.code]||"تعذّر الدخول ("+e.code+")");
};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("forgot").onclick=()=>{
  const m=$("em").value.trim();if(!m){$("lm").textContent="اكتب بريدك أولاً";return}
  sendPasswordResetEmail(auth,m).then(()=>{$("lm").style.color="var(--ok)";$("lm").textContent="أُرسل رابط تغيير كلمة المرور إلى بريدك"},()=>$("lm").textContent="تعذّر الإرسال");
};
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  user=u;if(unsub){unsub();unsub=null}
  if(!u){data=[];show("vLogin");return}
  isOwner=OWNERS.map(x=>x.toLowerCase()).includes((u.email||"").toLowerCase());
  $("who").textContent=u.email+(isOwner?" (مالك)":"");
  show("vHome");
  unsub=onSnapshot(col,{includeMetadataChanges:true},s=>{data=s.docs.map(d=>({id:d.id,...d.data()}));$("st").textContent=s.metadata.fromCache?"وضع عدم الاتصال: سيتزامن عند عودة الإنترنت":"متزامن";softRender()},e=>{$("st").textContent="تعذّر الاتصال: "+e.code});
});

/* ---- التنقل ---- */
document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
  book=t.dataset.book;openId=null;editName=editT=null;
  if(book==="team"){fillTeam();show("vTeam");return}
  if(book==="both"){renderBoth();show("vBoth");return}
  if(book==="backup"){fillBackup();show("vBackup");return}
  $("title").textContent=TITLES[book];$("vList").dataset.book=book;$("dueW").hidden=book!=="sports";$("q").value="";show("vList");render(true);
});
$("back").onclick=()=>show("vHome");

/* ---- العرض ---- */
const dueInfo=(c,b)=>{
  if(book!=="sports"||!c.due)return"";
  const d=Math.round((new Date(c.due+"T00:00:00")-new Date(new Date().toDateString()))/864e5),late=d<0&&b>0;
  const t=d<0?(b>0?"متأخر "+(-d)+" يوم":"انتهى "+c.due):d===0?"يستحق اليوم":d<=3?"يستحق بعد "+d+" أيام":"يستحق: "+c.due;
  return `<small class="due${late?" late":""}">${t}</small>`;
};
let editName=null,editT=null,pending=false;
function render(skip){
  if($("vList").hidden)return;
  const keep={};["pa","pi","ea","ei","en"].forEach(i=>{const e=$(i);if(e)keep[i]=e.value});
  const all=data.filter(c=>c.book===book).sort((a,b)=>(a.created||0)-(b.created||0));
  const today=iso(new Date());let total=0,late=0;
  all.forEach(c=>{const b=bal(c);total+=b;if(book==="sports"&&c.due&&b>0&&c.due<today)late++});
  $("tot").textContent=fmt(total);
  $("late").textContent=late?`تنبيه: ${late} زبون متأخر عن موعد الاشتراك`:"";
  $("names").innerHTML=all.map(c=>`<option value="${esc(c.name)}">`).join("");
  const q=nm($("q").value),rows=all.map((c,i)=>({c,i})).filter(r=>!q||nm(r.c.name).includes(q));
  if(!rows.length){$("list").innerHTML=`<div class="empty">${all.length?"لا توجد نتائج":"لم تُسجَّل أي ديون بعد."}</div>`;return}
  const LTR='style="direction:ltr;text-align:right"';
  $("list").innerHTML=`<div style="overflow-x:auto"><table class="tb"><thead><tr><th>#</th><th>الزبون</th><th>الحاجات المباعة</th><th>المبلغ الكلي</th></tr></thead><tbody>`+rows.map(({c,i})=>{
    const b=bal(c),items=esc((c.tx||[]).filter(t=>t.k==="d"&&t.n).map(t=>t.n).join("، "));
    let h=`<tr class="trow" data-id="${c.id}"><td class="c1">${i+1}</td><td>${esc(c.name)}${dueInfo(c,b)}</td><td class="c3">${items}</td><td class="c4 ${b>0?"neg":"z"}">${fmt(b)}</td></tr>`;
    if(c.id===openId){
      const tx=(c.tx||[]).slice().sort((x,y)=>x.t-y.t).slice(-10).reverse();
      h+=`<tr><td colspan="4">`
      +(editName===c.id?`<div class="box"><h3>تعديل اسم الزبون</h3><input class="in" id="en" value="${esc(c.name)}" autocomplete="off"><div class="acts"><button class="btn" data-svname="${c.id}" type="button">حفظ</button><button class="btn g" data-cancel="1" type="button">إلغاء</button></div></div>`:`<button class="btn g full" data-edname="${c.id}" type="button">تعديل اسم الزبون</button>`)
      +tx.map(t=>{
        const key=c.id+"|"+t.t;
        return `<div class="tx"><span class="t1">${new Date(t.t).toLocaleDateString("en-GB")}${t.n?" - "+esc(t.n):""}${t.by?" · "+esc(t.by):""}${t.ed?" (معدّل)":""}</span><b class="${t.k}">${t.k==="d"?"+":"-"}${fmt(t.a)}</b><button class="mini" data-edtx="${key}" type="button">✎</button></div>`
        +(editT===key?`<div class="box"><h3>تعديل العملية</h3><input class="in" id="ea" inputmode="decimal" value="${t.a}" ${LTR}>${t.k==="d"?`<input class="in" id="ei" value="${esc(t.n||"")}" placeholder="الحاجة" autocomplete="off">`:""}<div class="acts"><button class="btn" data-svtx="${key}" type="button">حفظ التعديل</button><button class="btn g" data-cancel="1" type="button">إلغاء</button></div></div>`:"");
      }).join("")
      +(book==="sports"?`<button class="btn g full" data-ren="${c.id}" type="button">تجديد الاشتراك شهراً</button>`:"")
      +`<input class="in" id="pa" inputmode="decimal" placeholder="المبلغ" autocomplete="off" ${LTR} style="margin-top:10px"><input class="in" id="pi" placeholder="الحاجة (عند إضافة دين جديد)" autocomplete="off"><div class="acts"><button class="btn pay" data-pay="${c.id}" type="button">تسديد</button><button class="btn more" data-more="${c.id}" type="button">دين جديد</button></div>`
      +(isOwner?`<button class="btn g full" style="color:var(--danger)" data-del="${c.id}" type="button">حذف الزبون</button>`:"")
      +`</td></tr>`;
    }
    return h;
  }).join("")+`</tbody></table></div>`;
  if(!skip)Object.keys(keep).forEach(k=>{const e=$(k);if(e&&keep[k])e.value=keep[k]});
}
const typing=()=>{const a=document.activeElement;return !!(a&&a.tagName==="INPUT"&&a.closest&&a.closest("#list"))};
const softRender=()=>{updBanner();if(!$("vBoth").hidden)renderBoth();if(typing())pending=true;else render()};
function renderBoth(){
  const m=Object.create(null);
  data.forEach(c=>{
    if(c.book!=="debts"&&c.book!=="sports")return;
    const k=nm(c.name),o=m[k]||(m[k]={name:c.name,debts:0,sports:0});
    o[c.book]+=bal(c);if(c.book==="debts")o.name=c.name;
  });
  const rows=Object.values(m).filter(o=>o.debts>0&&o.sports>0).sort((a,b)=>(b.debts+b.sports)-(a.debts+a.sports));
  let tot=0;rows.forEach(o=>tot+=o.debts+o.sports);
  $("bTot").textContent=fmt(tot);
  $("bCnt").textContent=rows.length?`عدد الزبائن: ${rows.length}`:"لا يوجد زبون مطلوب في القسمين";
  $("bList").innerHTML=rows.length?`<div style="overflow-x:auto"><table class="tb"><thead><tr><th>#</th><th>الزبون</th><th>دين المحل</th><th>الاشتراكات</th><th>المجموع</th></tr></thead><tbody>`+rows.map((o,i)=>`<tr><td class="c1">${i+1}</td><td>${esc(o.name)}</td><td class="c4 neg">${fmt(o.debts)}</td><td class="c4 neg">${fmt(o.sports)}</td><td class="c4 neg">${fmt(o.debts+o.sports)}</td></tr>`).join("")+`</tbody></table></div>`:`<div class="empty">لا يوجد زبون عليه دين في القسمين معاً.</div>`;
}
/* ---- النسخة الاحتياطية ---- */
const LB="lastBackup";
const lastB=()=>{try{return +localStorage.getItem(LB)||0}catch(e){return 0}};
const stampB=()=>{try{localStorage.setItem(LB,String(Date.now()))}catch(e){}updBanner();fillBackup()};
function updBanner(){
  const has=data.some(c=>c.book==="debts"||c.book==="sports");
  $("bkBanner").hidden=!(isOwner&&has&&Date.now()-lastB()>864e5);
}
setInterval(updBanner,60000);
function fillBackup(){
  const t=lastB();
  $("bkLast").textContent=t?"آخر نسخة على هذا الجهاز: "+new Date(t).toLocaleString("ar-EG"):"لم تُحفظ أي نسخة على هذا الجهاز بعد";
  $("bkRestore").hidden=!isOwner;
}
const dstamp=()=>new Date().toISOString().slice(0,10);
function backupFile(type,ext){
  return new File([JSON.stringify({app:"shop-debts",v:1,t:Date.now(),by:user.email,docs:data})],`debts-backup-${dstamp()}.${ext}`,{type});
}
function download(f){const u=URL.createObjectURL(f),a=document.createElement("a");a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function shareFile(f,title){
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title});return true}catch(e){if(e.name==="AbortError")return null}
  }
  return false;
}
$("bkBack").onclick=()=>show("vHome");
$("bkBanner").onclick=()=>$("bkWa").click();
$("bkWa").onclick=async()=>{
  if(!data.length)return toast("لا توجد بيانات",1);
  let f=backupFile("application/json","json"),r=await shareFile(f,"نسخة دفتر الديون");
  if(r===false){f=backupFile("text/plain","txt");r=await shareFile(f,"نسخة دفتر الديون")}
  if(r===null)return;
  if(r===false){download(f);toast("حُفظ الملف في جوالك، أرسله يدوياً إلى واتساب")}
  stampB();
};
$("bkSave").onclick=()=>{if(!data.length)return toast("لا توجد بيانات",1);download(backupFile("application/json","json"));stampB();toast("تم حفظ النسخة في جوالك")};
$("bkCsv").onclick=async()=>{
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[["القسم","#","الزبون","الحاجات","المبلغ الكلي"].map(q).join(",")];
  [["debts","الديون"],["sports","اشتراكات القنوات"]].forEach(([b,n])=>{
    data.filter(c=>c.book===b).sort((x,y)=>(x.created||0)-(y.created||0)).forEach((c,i)=>rows.push([n,i+1,c.name,(c.tx||[]).filter(t=>t.k==="d"&&t.n).map(t=>t.n).join("، "),bal(c)].map(q).join(",")));
  });
  const f=new File(["\ufeff"+rows.join("\r\n")],`debts-table-${dstamp()}.csv`,{type:"text/csv"});
  const r=await shareFile(f,"جدول الديون");if(r===null)return;
  if(r===false){download(f);toast("تم حفظ الجدول في جوالك")}
};
$("bkRestoreBtn").onclick=async e=>{
  const b=e.currentTarget,file=$("rFile").files[0];
  if(!isOwner)return;
  if(!file)return toast("اختر ملف النسخة أولاً",1);
  let o;try{o=JSON.parse(await file.text())}catch(_){return toast("الملف غير صالح",1)}
  const ok=d=>d&&typeof d.id==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(d.id)&&["debts","sports","team"].includes(d.book)&&typeof d.name==="string"&&Array.isArray(d.tx)&&d.tx.every(t=>t&&typeof t.a==="number"&&(t.k==="d"||t.k==="p")&&typeof t.t==="number");
  if(!(o&&o.app==="shop-debts"&&Array.isArray(o.docs)&&o.docs.length&&o.docs.every(ok)))return toast("هذه ليست نسخة صالحة من دفتر الديون",1);
  const key=file.name+"|"+o.docs.length;
  if(!(b.dataset.armed&&b.dataset.amt===key)){arm(b,`تأكيد استعادة ${o.docs.length} سجلاً؟ سيحل محل السجلات الموجودة بالأرقام نفسها`,"استعادة النسخة");b.dataset.amt=key;return}
  disarm(b,"استعادة النسخة");
  w(Promise.all(o.docs.map(d=>{
    const body={book:d.book,name:d.name,tx:d.tx,due:/^\d{4}-\d\d-\d\d$/.test(d.due||"")?d.due:"",created:+d.created||0};
    if(d.book==="team"){body.owner=String(d.owner||"");body.staff=Array.isArray(d.staff)?d.staff.map(String).slice(0,5):[]}
    return setDoc(doc(col,d.id),body);
  })));
  $("rFile").value="";toast("تمت الاستعادة");
};

$("bBack").onclick=()=>show("vHome");
$("q").oninput=()=>render();
$("n").oninput=()=>{
  const n=nm($("n").value),f=n&&data.find(c=>c.book===book&&nm(c.name)===n);
  $("hint").textContent=f?`زبون موجود - رصيده الحالي: ${fmt(bal(f))}. اكتب المبلغ المضاف فقط وسيُجمع عليه.`:(n?"زبون جديد":"");
};

/* ---- إضافة دين (بخطوتين) ---- */
$("add").onclick=e=>{
  const b=e.currentTarget,name=$("n").value.replace(/\s+/g," ").trim(),a=num($("a").value),item=$("it").value.trim(),due=$("due").value;
  if(!name)return toast("أدخل اسم الزبون",1);
  if(!(a>0))return toast("أدخل مبلغاً صحيحاً",1);
  const ex=data.find(c=>c.book===book&&nm(c.name)===nm(name)),key=[name,a,item,due].join("|");
  if(!(b.dataset.armed&&b.dataset.amt===key)){
    arm(b,`تأكيد إضافة ${fmt(a)}${item?" ("+item+")":""} ${ex?"إلى "+ex.name+" (رصيده "+fmt(bal(ex))+")":"لزبون جديد: "+name}؟`,"إضافة الدين");b.dataset.amt=key;return;
  }
  disarm(b,"إضافة الدين");
  const en={k:"d",a,n:item,t:Date.now(),by:user.email};
  w(ex?updateDoc(doc(col,ex.id),{tx:arrayUnion(en),...(due?{due}:{})}):addDoc(col,{book,name,tx:[en],due:due||"",created:Date.now()}));
  toast("تمت الإضافة. الرصيد الآن: "+fmt((ex?bal(ex):0)+a));
  $("n").value=$("a").value=$("it").value=$("due").value="";$("hint").textContent="";
};
["n","a","it","due"].forEach(i=>$(i).addEventListener("input",()=>{const b=$("add");if(b.dataset.armed)disarm(b,"إضافة الدين")}));

/* ---- فريق العمل ---- */
const TS=["tOwner","tS0","tS1","tS2","tS3","tS4"];
function fillTeam(){
  const t=data.find(c=>c.book==="team")||{},st=t.staff||[];
  $("tOwner").value=t.owner||"";for(let i=0;i<5;i++)$("tS"+i).value=st[i]||"";
  TS.forEach(id=>$(id).disabled=!isOwner);$("tSave").hidden=!isOwner;
}
$("tBack").onclick=()=>show("vHome");
$("tSave").onclick=()=>{
  const owner=$("tOwner").value.trim(),staff=[0,1,2,3,4].map(i=>$("tS"+i).value.trim()),ex=data.find(c=>c.book==="team");
  w(ex?updateDoc(doc(col,ex.id),{owner,staff}):addDoc(col,{book:"team",name:"team",tx:[],owner,staff,created:0}));
  toast("تم حفظ الأسماء");
};

/* ---- إجراءات الزبون ---- */
$("list").addEventListener("focusout",()=>setTimeout(()=>{if(pending&&!typing()){pending=false;render()}},80));
$("list").oninput=e=>{
  const id=e.target.id;
  if(id==="pa"||id==="pi")$("list").querySelectorAll("[data-pay],[data-more]").forEach(b=>{if(b.dataset.armed)disarm(b,b.dataset.pay?"تسديد":"دين جديد")});
  if(id==="ea"||id==="ei"||id==="en")$("list").querySelectorAll("[data-svtx],[data-svname]").forEach(b=>{if(b.dataset.armed)disarm(b,b.dataset.svtx?"حفظ التعديل":"حفظ")});
};
$("list").onclick=e=>{
  const el=e.target.closest("[data-id],[data-pay],[data-more],[data-ren],[data-del],[data-edname],[data-svname],[data-edtx],[data-svtx],[data-cancel]");if(!el)return;
  const d=el.dataset;
  if(d.id){openId=openId===d.id?null:d.id;editName=editT=null;render(true);return}
  if(d.cancel){editName=editT=null;render(true);return}
  if(d.edname){editName=d.edname;editT=null;render(true);return}
  if(d.edtx){editT=d.edtx;editName=null;render(true);return}
  const id=d.pay||d.more||d.ren||d.del||d.svname||(d.svtx||"").split("|")[0],c=data.find(x=>x.id===id);if(!c)return;
  const ref=doc(col,id);
  if(d.svname){
    const n=$("en").value.replace(/\s+/g," ").trim();
    if(!n)return toast("اكتب الاسم",1);
    if(data.some(x=>x.id!==c.id&&x.book===book&&nm(x.name)===nm(n)))return toast("هذا الاسم مسجل لزبون آخر",1);
    if(n===c.name){editName=null;render(true);return}
    if(!(el.dataset.armed&&d.amt===n)){arm(el,`تأكيد تغيير الاسم إلى «${n}»؟`,"حفظ");el.dataset.amt=n;return}
    w(updateDoc(ref,{name:n}));editName=null;render(true);toast("تم تعديل الاسم");return;
  }
  if(d.svtx){
    const t=(c.tx||[]).find(x=>String(x.t)===d.svtx.split("|")[1]);if(!t)return;
    const a=num($("ea").value),n=t.k==="d"?$("ei").value.trim():(t.n||"");
    if(!(a>0))return toast("أدخل مبلغاً صحيحاً",1);
    const key=a+"|"+n;
    if(!(el.dataset.armed&&d.amt===key)){arm(el,`تأكيد التعديل: ${fmt(t.a)} ← ${fmt(a)}؟`,"حفظ التعديل");el.dataset.amt=key;return}
    w(updateDoc(ref,{tx:c.tx.map(x=>x===t?{...x,a,n,ed:user.email}:x)}));editT=null;render(true);toast("تم التعديل");return;
  }
  if(d.del){
    if(!el.dataset.armed){const b=bal(c);arm(el,`تأكيد حذف «${c.name}» وكل سجله${b>0?" (عليه "+fmt(b)+")":""}؟`,"حذف الزبون");return}
    openId=null;w(deleteDoc(ref));toast("تم حذف الزبون");return;
  }
  if(d.ren){
    const cur=c.due&&c.due>iso(new Date())?new Date(c.due+"T00:00:00"):new Date();cur.setMonth(cur.getMonth()+1);
    w(updateDoc(ref,{due:iso(cur)}));return;
  }
  const a=num($("pa").value);
  if(!(a>0)){$("pa").style.borderColor="var(--danger)";return}
  const isPay=!!d.pay,item=isPay?"":$("pi").value.trim(),key=a+"|"+item;
  if(!(el.dataset.armed&&d.amt===key)){
    arm(el,isPay?(a>bal(c)?"المبلغ أكبر من الدين! ":"")+`تأكيد تسديد ${fmt(a)}؟`:`تأكيد دين ${fmt(a)}${item?" ("+item+")":""}؟`,isPay?"تسديد":"دين جديد");el.dataset.amt=key;return;
  }
  $("pa").value="";$("pi").value="";
  w(updateDoc(ref,{tx:arrayUnion({k:isPay?"p":"d",a,n:item,t:Date.now(),by:user.email})}));
  toast(isPay?"تم التسديد":"تمت إضافة الدين");
};
</script>
</body>
</html>
